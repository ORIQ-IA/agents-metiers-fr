<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Agents metiers FR, par Oriq, agence IA francaise">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13233f"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#fond)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#trait)"/>

  <g opacity="0.07" fill="none" stroke="#0066FF" stroke-width="1.5">
    <circle cx="1040" cy="150" r="58"/>
    <circle cx="1040" cy="150" r="96"/>
    <circle cx="1040" cy="150" r="134"/>
  </g>

  <text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="7" fill="#0066FF">ORIQ</text>

  <text x="80" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Agents métiers FR</text>

  <text x="80" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#9fb3d4">28 agents IA qui connaissent les métiers et les secteurs français</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6d84a8">
    <text x="80" y="258">12 secteurs</text>
    <text x="205" y="258">·</text>
    <text x="225" y="258">10 fonctions d'entreprise</text>
    <text x="455" y="258">·</text>
    <text x="475" y="258">6 domaines transverses</text>
    <text x="680" y="258">·</text>
    <text x="700" y="258">licence MIT</text>
  </g>

  <text x="1120" y="268" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6d84a8">oriq.fr</text>
</svg>
